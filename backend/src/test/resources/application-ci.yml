spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    placeholders:
      vector-extension-init: "CREATE EXTENSION IF NOT EXISTS vector;"
      hnsw-index-init: "CREATE INDEX IF NOT EXISTS idx_rag_emb_vector_idx ON rag_document_chunk_embeddings (embedding_model);"
      jsonb-type: "JSONB"
      vector-type: "vector(1536)"
      vector-store-indexes: "CREATE INDEX IF NOT EXISTS idx_ai_vector_store_hnsw ON ai_vector_store USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64); CREATE INDEX IF NOT EXISTS idx_ai_vector_store_metadata ON ai_vector_store USING gin (metadata); CREATE INDEX IF NOT EXISTS idx_ai_vector_store_metadata_user ON ai_vector_store ((metadata->>'userId')); CREATE INDEX IF NOT EXISTS idx_ai_vector_store_metadata_resource ON ai_vector_store ((metadata->>'resourceId'));"

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
