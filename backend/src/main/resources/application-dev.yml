spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      vector-extension-init: "CREATE EXTENSION IF NOT EXISTS vector;"
      hnsw-index-init: "CREATE INDEX IF NOT EXISTS idx_rag_emb_vector_hnsw ON rag_document_chunk_embeddings USING hnsw ((vector::vector(1536)) vector_cosine_ops);"
      jsonb-type: "JSONB"
      vector-type: "vector(1536)"
      vector-store-indexes: "CREATE INDEX IF NOT EXISTS idx_ai_vector_store_hnsw ON ai_vector_store USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64); CREATE INDEX IF NOT EXISTS idx_ai_vector_store_metadata ON ai_vector_store USING gin (metadata); CREATE INDEX IF NOT EXISTS idx_ai_vector_store_metadata_user ON ai_vector_store ((metadata->>'userId')); CREATE INDEX IF NOT EXISTS idx_ai_vector_store_metadata_resource ON ai_vector_store ((metadata->>'resourceId'));"
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.abhiiterates.os: DEBUG

management:
  endpoint:
    health:
      show-details: always
