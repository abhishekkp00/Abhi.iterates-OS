name: Abhi.iterates-OS CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test (Spring Boot 3 + PostgreSQL/pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: abhi_iterates_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abhi_iterates_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Backend Compilation & Run Unit/Integration Tests
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/abhi_iterates_os_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgrespassword
          JWT_SECRET: c29tZS1zdXBlci1zZWNyZXQtand0LWtleS1mb3ItY2ktaW50ZWdyYXRpb24tdGVzdHMtYmhhdjE1MTI=
          ADMIN_EMAIL: admin@ci.local
          ADMIN_PASSWORD: AdminPassword123!
        run: mvn clean test -B

  frontend-build-and-test:
    name: Frontend Build & Type Check (React + TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify TypeScript Compilation & Production Build
        working-directory: ./frontend
        run: npm run build
