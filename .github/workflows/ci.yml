name: Abhi.iterates-OS Reproducible CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci-pipeline:
    name: Continuous Integration & Build Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: abhi_iterates_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abhi_iterates_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout Code Repository
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # Step 2: Backend Build
      - name: 2. Backend Build
        working-directory: ./backend
        run: mvn clean compile -B

      # Step 3: Backend Tests
      - name: 3. Backend Tests
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: c29tZS1zdXBlci1zZWNyZXQtand0LWtleS1mb3ItY2ktaW50ZWdyYXRpb24tdGVzdHMtYmhhdjE1MTI=
          ADMIN_EMAIL: admin@ci.local
          ADMIN_PASSWORD: AdminPassword123!
        run: mvn test -B

      # Step 4: Frontend Install
      - name: 4. Frontend Install
        working-directory: ./frontend
        run: npm ci

      # Step 5: Frontend Tests
      - name: 5. Frontend Tests
        working-directory: ./frontend
        run: npm test

      # Step 6: Frontend Build
      - name: 6. Frontend Build
        working-directory: ./frontend
        run: npm run build

      # Step 7: Docker Build
      - name: 7. Docker Build
        env:
          JWT_SECRET: c29tZS1zdXBlci1zZWNyZXQtand0LWtleS1mb3ItY2ktaW50ZWdyYXRpb24tdGVzdHMtYmhhdjE1MTI=
          POSTGRES_PASSWORD: postgrespassword
          ADMIN_PASSWORD: AdminPassword123!
        run: docker compose build

      # Step 8: Optional Image Push (runs only if registry credentials are provided)
      - name: 8. Optional Image Push
        if: ${{ env.DOCKER_REGISTRY_USER != '' && secrets.DOCKER_REGISTRY_PASSWORD != '' }}
        env:
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin
          docker push abhi-os-backend:latest
          docker push abhi-os-frontend:latest
